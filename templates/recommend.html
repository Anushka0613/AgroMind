<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Smart Crop</a>

        <div>
            <a href="/" class="btn btn-light">Home</a>
        </div>
    </div>
</nav>

<section class="recommend-section py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="recommend-card p-4 shadow rounded bg-white">

<h2 class="text-center mb-4">
Crop Recommendation
</h2>

<form action="{{ url_for('predict') }}" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Nitrogen (N)</label>
<input type="number" class="form-control" name="N" required>
</div>

<div class="col-md-6 mb-3">
<label>Phosphorus (P)</label>
<input type="number" class="form-control" name="P" required>
</div>

<div class="col-md-6 mb-3">
<label>Potassium (K)</label>
<input type="number" class="form-control" name="K" required>
</div>

<div class="col-md-6 mb-3">
<label>Temperature (°C)</label>
<input type="number" step="0.1" class="form-control" name="temperature" required>
</div>

<div class="col-md-6 mb-3">
<label>Humidity (%)</label>
<input type="number" step="0.1" class="form-control" name="humidity" required>
</div>

<div class="col-md-6 mb-3">
<label>pH Value</label>
<input type="number" step="0.1" class="form-control" name="ph" required>
</div>

<div class="col-md-12 mb-4">
<label>Rainfall (mm)</label>
<input type="number" step="0.1" class="form-control" name="rainfall" required>
</div>

<div class="text-center">
<button type="submit" class="btn btn-success btn-lg">
<i class="fa-solid fa-seedling"></i>
Recommend Crop
</button>
</div>

</div>

</form>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
