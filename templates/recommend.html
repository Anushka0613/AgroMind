<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ _("Crop Recommendation") }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">

<div class="container">

<a class="navbar-brand fw-bold" href="/">

🌾 {{ _("Smart Crop") }}

</a>

<a href="/" class="btn btn-light">

{{ _("Home") }}

</a>

</div>

</nav>

<section class="recommend-section py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="recommend-card p-4 shadow rounded bg-white">

<h2 class="text-center mb-4">

🌱 {{ _("Crop Recommendation") }}

</h2>

<hr>

<h3 class="text-success">

🌤️ {{ _("Auto Fill Weather Data") }}

</h3>

<form action="/get_weather" method="POST">

<div class="row">

<div class="col-md-8">

<input
type="text"
name="city"
class="form-control"
placeholder="{{ _('Enter City Name (Example: Delhi)') }}"
required>

</div>

<div class="col-md-4">

<button class="btn btn-primary w-100">

☁️ {{ _("Get Weather") }}

</button>

</div>

</div>

</form>

<br>

<form action="{{ url_for('predict') }}" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>{{ _("Nitrogen (N)") }}</label>

<input
type="number"
class="form-control"
name="N"
required>

</div>

<div class="col-md-6 mb-3">

<label>{{ _("Phosphorus (P)") }}</label>

<input
type="number"
class="form-control"
name="P"
required>

</div>

<div class="col-md-6 mb-3">

<label>{{ _("Potassium (K)") }}</label>

<input
type="number"
class="form-control"
name="K"
required>

</div>

<div class="col-md-6 mb-3">

<label>{{ _("Temperature (°C)") }}</label>

<input
type="number"
step="0.1"
class="form-control"
name="temperature"
value="{% if weather %}{{ temperature }}{% endif %}"
required>

</div>

<div class="col-md-6 mb-3">

<label>{{ _("Humidity (%)") }}</label>

<input
type="number"
step="0.1"
class="form-control"
name="humidity"
value="{% if weather %}{{ humidity }}{% endif %}"
required>

</div>

<div class="col-md-6 mb-3">

<label>{{ _("pH Value") }}</label>

<input
type="number"
step="0.1"
class="form-control"
name="ph"
required>

</div>

<div class="col-md-12 mb-4">

<label>{{ _("Rainfall (mm)") }}</label>

<input
type="number"
step="0.1"
class="form-control"
name="rainfall"
value="{% if weather %}{{ rainfall }}{% endif %}"
required>

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-success btn-lg">

<i class="fa-solid fa-seedling"></i>

{{ _("Recommend Crop") }}

</button>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</section>

<footer class="bg-success text-white text-center py-3 mt-5">

<div class="container">

<h5>

🌾 {{ _("Smart Crop Recommendation System") }}

</h5>

<p class="mb-0">

{{ _("AI • Machine Learning • Flask • Agriculture") }}

</p>

</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
